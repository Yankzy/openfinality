version: '3.7'

networks:
  afro_network:
    name: afro_network

services:
  # Orderers
  orderer1.ordererorg.openfinality.com:
    container_name: orderer1.ordererorg.openfinality.com
    image: hyperledger/fabric-orderer:3.1.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
    ports:
      - "7050:7050"
      - "7053:7053"
    volumes:
      - ../organizations/orderer/orderers/orderer1/msp:/var/hyperledger/orderer/msp
      - ../organizations/orderer/orderers/orderer1/tls:/var/hyperledger/orderer/tls
      - orderer1_data:/var/hyperledger/production/orderer
    networks:
      - afro_network

  orderer2.ordererorg.openfinality.com:
    container_name: orderer2.ordererorg.openfinality.com
    image: hyperledger/fabric-orderer:3.1.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=8050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:8053
    ports:
      - "8050:8050"
      - "8053:8053"
    volumes:
      - ../organizations/orderer/orderers/orderer2/msp:/var/hyperledger/orderer/msp
      - ../organizations/orderer/orderers/orderer2/tls:/var/hyperledger/orderer/tls
      - orderer2_data:/var/hyperledger/production/orderer
    networks:
      - afro_network

  orderer3.ordererorg.openfinality.com:
    container_name: orderer3.ordererorg.openfinality.com
    image: hyperledger/fabric-orderer:3.1.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=9050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:9053
    ports:
      - "9050:9050"
      - "9053:9053"
    volumes:
      - ../organizations/orderer/orderers/orderer3/msp:/var/hyperledger/orderer/msp
      - ../organizations/orderer/orderers/orderer3/tls:/var/hyperledger/orderer/tls
      - orderer3_data:/var/hyperledger/production/orderer
    networks:
      - afro_network

  orderer4.ordererorg.openfinality.com:
    container_name: orderer4.ordererorg.openfinality.com
    image: hyperledger/fabric-orderer:3.1.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=10050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:10053
    ports:
      - "10050:10050"
      - "10053:10053"
    volumes:
      - ../organizations/orderer/orderers/orderer4/msp:/var/hyperledger/orderer/msp
      - ../organizations/orderer/orderers/orderer4/tls:/var/hyperledger/orderer/tls
      - orderer4_data:/var/hyperledger/production/orderer
    networks:
      - afro_network

  # Peers
  peer0.nigeriaorg.openfinality.com:
    container_name: peer0.nigeriaorg.openfinality.com
    user: "0"
    image: hyperledger/fabric-peer:3.1.5
    environment:
      - CORE_VM_ENDPOINT=unix:///var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=afro_network
      - FABRIC_LOGGING_SPEC=DEBUG
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=true
      - CORE_PEER_TLS_CERTIFICATE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_PRIVATEKEY=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.nigeriaorg.openfinality.com
      - CORE_PEER_ADDRESS=peer0.nigeriaorg.openfinality.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.nigeriaorg.openfinality.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.nigeriaorg.openfinality.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.nigeriaorg.openfinality.com:7051
      - CORE_PEER_LOCALMSPID=NigeriaMSP
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb_nigeria:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    ports:
      - "7051:7051"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../organizations/nigeria/peers/peer0/msp:/etc/hyperledger/fabric/msp
      - ../organizations/nigeria/peers/peer0/tls:/etc/hyperledger/fabric/tls
      - ../organizations/orderer/orderers/orderer1/tls/ca.crt:/etc/hyperledger/fabric/tls/orderer/server.crt
      - ../organizations/nigeria/users/Admin@nigeriaorg.openfinality.com/msp:/etc/hyperledger/fabric/admin-msp
      - ../organizations:/etc/hyperledger/fabric/organizations
      - peer0_nigeria_data:/var/hyperledger/production
    networks:
      - afro_network

  peer0.ghanaorg.openfinality.com:
    container_name: peer0.ghanaorg.openfinality.com
    user: "0"
    image: hyperledger/fabric-peer:3.1.5
    environment:
      - CORE_VM_ENDPOINT=unix:///var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=afro_network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=true
      - CORE_PEER_TLS_CERTIFICATE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_PRIVATEKEY=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.ghanaorg.openfinality.com
      - CORE_PEER_ADDRESS=peer0.ghanaorg.openfinality.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.ghanaorg.openfinality.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.ghanaorg.openfinality.com:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.ghanaorg.openfinality.com:9051
      - CORE_PEER_LOCALMSPID=GhanaMSP
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb_ghana:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    ports:
      - "9051:9051"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../organizations/ghana/peers/peer0/msp:/etc/hyperledger/fabric/msp
      - ../organizations/ghana/peers/peer0/tls:/etc/hyperledger/fabric/tls
      - ../organizations/orderer/orderers/orderer1/tls/ca.crt:/etc/hyperledger/fabric/tls/orderer/server.crt
      - ../organizations/ghana/users/Admin@ghanaorg.openfinality.com/msp:/etc/hyperledger/fabric/admin-msp
      - ../organizations:/etc/hyperledger/fabric/organizations
      - peer0_ghana_data:/var/hyperledger/production
    networks:
      - afro_network

  peer0.moroccoorg.openfinality.com:
    container_name: peer0.moroccoorg.openfinality.com
    user: "0"
    image: hyperledger/fabric-peer:3.1.5
    environment:
      - CORE_VM_ENDPOINT=unix:///var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=afro_network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=true
      - CORE_PEER_TLS_CERTIFICATE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_PRIVATEKEY=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.moroccoorg.openfinality.com
      - CORE_PEER_ADDRESS=peer0.moroccoorg.openfinality.com:11051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:11051
      - CORE_PEER_CHAINCODEADDRESS=peer0.moroccoorg.openfinality.com:11052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:11052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.moroccoorg.openfinality.com:11051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.moroccoorg.openfinality.com:11051
      - CORE_PEER_LOCALMSPID=MoroccoMSP
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb_morocco:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    ports:
      - "11051:11051"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../organizations/morocco/peers/peer0/msp:/etc/hyperledger/fabric/msp
      - ../organizations/morocco/peers/peer0/tls:/etc/hyperledger/fabric/tls
      - ../organizations/orderer/orderers/orderer1/tls/ca.crt:/etc/hyperledger/fabric/tls/orderer/server.crt
      - ../organizations/morocco/users/Admin@moroccoorg.openfinality.com/msp:/etc/hyperledger/fabric/admin-msp
      - ../organizations:/etc/hyperledger/fabric/organizations
      - peer0_morocco_data:/var/hyperledger/production
    networks:
      - afro_network

volumes:
  orderer1_data:
  orderer2_data:
  orderer3_data:
  orderer4_data:
  peer0_nigeria_data:
  peer0_ghana_data:
  peer0_morocco_data:
